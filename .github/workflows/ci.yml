name: CI & Governance Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format-and-lint:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Clippy Analysis (All Features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test-suite:
    name: Unit & Integration Tests (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.70.0", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: Clippy Analysis (${{ matrix.toolchain }})
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Core Tests (Zero Dependencies)
        run: cargo test --locked --verbose

      - name: Run All Tests (Including MCP Feature)
        run: cargo test --locked --all-features --verbose

      - name: Verify Strict Test Count Audit
        run: ./scripts/verify_test_count.sh

  examples-verification:
    name: Live Demos & Micro-Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Live TCP Agent Proxy Demo
        run: cargo run --locked --example live_agent_proxy

      - name: Run MCP Governance Shield Demo
        run: cargo run --locked --example mcp_shield_demo --features mcp

      - name: Run Release Latency Micro-Benchmark
        run: cargo run --locked --release --example benchmark_latency
