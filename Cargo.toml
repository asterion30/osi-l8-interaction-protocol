[package]
name = "ilp-core"
version = "0.1.0"
edition = "2021"
authors = ["OSI Layer 8 Working Group <ilp-spec@asterion.org>"]
description = "Reference prototype for OSI Layer 8 Interaction Protocol (ILP / RFC-ILP-2026)"
license = "MIT"

[dependencies]
# Standard library first design: zero external dependencies required for core wire protocol and MSAC firewall!
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }

[features]
default = []
mcp = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "ilp-core"
path = "src/main.rs"

[[bin]]
name = "ilp_mcp_sidecar"
path = "src/bin/ilp_mcp_sidecar.rs"
required-features = ["mcp"]

[[bin]]
name = "ilp_mcp_gateway"
path = "src/bin/ilp_mcp_gateway.rs"
required-features = ["mcp"]
