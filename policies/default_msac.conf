# ==============================================================================
# RFC-ILP-2026: Mandatory Semantic Access Control (MSAC) - Default Policy Config
# ==============================================================================
# Este archivo define las políticas soberanas del usuario para el Cognitive Reference Monitor (CRM).
# Puede cargarse en runtime mediante `UserGovernancePolicy::from_conf_str(...)` sin recompilar.

# Identificador Descentralizado (DID) del usuario o autoridad soberana
user_did = did:key:z6MkhaXgBZDvotDkL5257faiz48xzpq2541

# Techo máximo de presupuesto computable admisible por negociación o tarea (en micro-créditos)
max_budget_cap = 50000

# Grado máximo de autonomía conferido a agentes en este host (0 a 63)
# Tier 0: Solo lectura | Tier 1: Asistido | Tier 2: Delegado | Tier 3: Autónomo acotado
max_autonomy_tier = 3

# Tiempo máximo admisible de vida (TTL) para cualquier interacción (en milisegundos)
max_deadline_ms = 15000

# Nivel de autonomía a partir del cual es obligatorio exigir REQUIRE_SANDBOXED_INFERENCE
require_sandbox_above_tier = 2

# Bloqueo estricto de egreso a internet/redes externas si el proceso está contaminado por datos clasificados
deny_external_egress_if_tainted = true

# Lista negra de habilidades semánticas prohibidas (hashes FNV-1a de 64 bits en hexadecimal o decimal)
# Ejemplo: Bloqueo de exfiltración de memoria o manipulación de firmware no autorizada
blacklist_skill = 0xDEADBEEF00000001
blacklist_skill = 0xBAD0CAFE00000002

# Lista blanca opcional de habilidades (si se define al menos una, solo estas pasarán)
# whitelist_skill = 0xCAFEBABE11223344
